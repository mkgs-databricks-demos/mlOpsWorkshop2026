# Declarative Automation Bundle configuration
# Bundle 2 of 3: Model Serving Endpoint + AI Gateway
bundle:
  name: mlops-workshop-ai

variables:
  catalog:
    description: "Must match -infra catalog"
    default: "hls_fde_dev"
  user_schema:
    description: "Actual deployed schema name from -infra (includes dev-mode prefix in dev)"
  registered_model_name:
    description: "Full 3-level UC name of registered model from -infra"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
    variables:
      catalog: hls_fde_dev
      # Dev-mode prefix from -infra: dev_<user>_<base_schema>
      user_schema: "dev_${workspace.current_user.short_name}_mlops_workshop"
      registered_model_name: "hls_fde_dev.dev_${workspace.current_user.short_name}_mlops_workshop.dev_${workspace.current_user.short_name}_churn_model"

  prod:
    mode: production
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
      root_path: /Users/matthew.giglia@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mlops_workshop
      user_schema: mlops_prod
      registered_model_name: "mlops_workshop.mlops_prod.churn_model"
    run_as:
      user_name: matthew.giglia@databricks.com
