# Data Ingestion Job — lands synthetic data, then triggers SDP pipeline
# Gated by ${var.use_zerobus} condition task
#
# Task graph:
#   generate_ndjson (→ writes NDJSON directly to landing volume)
#     → check_zerobus_gate
#       ├─ TRUE: post_to_zerobus
#       └─ FALSE: (no-op)
#   run_ingestion_pipeline (depends on generate_ndjson + post_to_zerobus, AT_LEAST_ONE_SUCCESS)
#
# Bronze → Silver processing is handled by the SDP pipeline
# defined in data_ingestion_pipeline.yml.
resources:
  jobs:
    data_ingestion:
      name: "[${bundle.target}] mlops-workshop-data-prep"
      tags:
        bundle: mlops-workshop-infra
        workshop: mlops-workshop-2026

      tasks:
        # 1. Generate synthetic NDJSON data → writes directly to landing volume
        - task_key: generate_ndjson
          notebook_task:
            notebook_path: ../src/data/generate_ndjson.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.workshop_schema.name}
              volume_path: "/Volumes/${resources.schemas.workshop_schema.catalog_name}/${resources.schemas.workshop_schema.name}/${resources.volumes.landing_volume.name}"

        # 2. Condition gate: ZeroBus or Auto Loader?
        - task_key: check_zerobus_gate
          depends_on:
            - task_key: generate_ndjson
          condition_task:
            left: ${var.use_zerobus}
            op: EQUAL_TO
            right: "true"

        # 3a. TRUE path: Stream via ZeroBus API
        - task_key: post_to_zerobus
          depends_on:
            - task_key: check_zerobus_gate
              outcome: "true"
          notebook_task:
            notebook_path: ../src/data/post_to_zerobus.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.workshop_schema.name}

        # 3b. Trigger SDP pipeline for bronze → silver processing
        #     (generate_ndjson already wrote NDJSON to landing volume)
        - task_key: run_ingestion_pipeline
          depends_on:
            - task_key: post_to_zerobus
            - task_key: generate_ndjson
          run_if: AT_LEAST_ONE_SUCCESS
          pipeline_task:
            pipeline_id: ${resources.pipelines.data_ingestion_pipeline.id}
