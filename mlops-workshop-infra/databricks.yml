# Declarative Automation Bundle configuration
# Bundle 1 of 3: Infrastructure, Data, Training & Promotion
bundle:
  name: mlops-workshop-infra

variables:
  catalog:
    description: "Customer-provided Unity Catalog (USE CATALOG + CREATE SCHEMA)"
    default: "mlops_workshop"
  user_schema:
    description: "Per-participant schema name"
  use_zerobus:
    description: "Route data through ZeroBus API (true) or Auto Loader (false)"
    default: "false"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
    variables:
      catalog: mlops_workshop
      user_schema: "user_${bundle.user_name}"

  prod:
    mode: production
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
      root_path: /Users/matthew.giglia@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mlops_workshop
      user_schema: mlops_prod
      use_zerobus: "true"
    run_as:
      user_name: matthew.giglia@databricks.com
