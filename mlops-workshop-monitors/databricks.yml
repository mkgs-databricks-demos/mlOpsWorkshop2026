# Declarative Automation Bundle configuration
# Bundle 3 of 3: Quality Monitors, Dashboard & Retraining
bundle:
  name: mlops-workshop-monitors

variables:
  catalog:
    description: "Must match -infra catalog"
    default: "mlops_workshop"
  user_schema:
    description: "Must match -infra schema"
  warehouse_id:
    description: "SQL warehouse for dashboard queries"
  training_job_id:
    description: "Job ID of -infra churn_model_training job (cross-bundle)"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
    variables:
      catalog: mlops_workshop
      user_schema: "user_${bundle.user_name}"

  prod:
    mode: production
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
      root_path: /Users/matthew.giglia@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mlops_workshop
      user_schema: mlops_prod
    run_as:
      user_name: matthew.giglia@databricks.com
